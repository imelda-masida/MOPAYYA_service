<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="/static/js/admin.js" defer></script>
    <title>Tableau de Bord Administration - MOPAYA</title>


    <style>
        :root {
            --mopaya-green: #077d13;
            --mopaya-red: #9b1414;
        }

        
        .bg-primary {
            background-color: var(--mopaya-green) !important;
        }

        
        .text-primary {
            color: var(--mopaya-green) !important;
        }

        
        .btn-success {
            background-color: var(--mopaya-green) !important;
            border-color: var(--mopaya-green) !important;
        }
        .btn-success:hover {
            background-color: #055c0e !important;
            border-color: #055c0e !important;
        }

        
        .btn-danger {
            background-color: var(--mopaya-red) !important;
            border-color: var(--mopaya-red) !important;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--mopaya-green) !important;
            box-shadow: 0 0 0 0.25rem rgba(7, 125, 19, 0.25) !important;
        }

        /* En-tête du tableau */
        .table-light {
            background-color: #e8f5e9 !important;
        }
    </style>
</head>
<body class="bg-light">
    
    <!-- BARRE DE NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">MOPAYA - Administration</a>
            <div class="d-flex gap-2">
                <a href="/" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">Accueil</a>
                <a href="/admin/logout" class="btn btn-danger btn-sm">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm p-3">
                    <h6 class="text-muted">Visites Aujourd'hui</h6>
                    <h2 class="mb-0 fw-bold text-primary" id="stat-aujourdhui">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm p-3">
                    <h6 class="text-muted">Actuellement sur Site</h6>
                    <h2 class="mb-0 fw-bold text-success" id="stat-sur-site">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm p-3">
                    <h6 class="text-muted">Visiteurs Récurrents</h6>
                    <h2 class="mb-0 fw-bold text-warning" id="stat-recurrents">0</h2>
                </div>
            </div>
        </div>

        
        <div class="card border-0 shadow-sm mb-4 p-4">
            <h5 class="fw-bold mb-3 text-dark">Ajouter un nouveau membre</h5>
            <form action="/admin/membres/ajouter" method="POST" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="nom_membre" class="form-label text-muted fw-semibold">Nom complet</label>
                    <input type="text" id="nom_membre" name="nom" class="form-control" placeholder="Ex: Marc Kabora" required>
                </div>
                <div class="col-md-5">
                    <label for="service_membre" class="form-label text-muted fw-semibold">Département / Service</label>
                    <input type="text" id="service_membre" name="service" class="form-control" placeholder="Ex: Comptabilité" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100 fw-semibold">Ajouter</button>
                </div>
            </form>
        </div>

        <!-- ZONE DE FILTRES ET TÉLÉCHARGEMENT DE RAPPORTS -->
        <div class="card border-0 shadow-sm mb-4 p-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <input type="text" id="filtre-recherche" class="form-control" placeholder="Rechercher par nom, téléphone, entreprise...">
                </div>
                <div class="col-md-4">
                    <select id="filtre-hote" class="form-select">
                        <option value="">Tous les hôtes visités</option>
                    </select>
                </div>
                <div class="col-md-3 text-end d-flex gap-2 justify-content-end">
                    <a href="/api/rapport/semaine?format=csv" class="btn btn-outline-secondary">Exporter CSV</a>
                    <a href="/api/rapport/semaine?format=pdf" class="btn btn-outline-danger">Exporter PDF</a>
                </div>
            </div>
        </div>

        <!-- TABLEAU DES VISITES -->
        <div class="card border-0 shadow-sm p-3 mb-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Visiteur</th>
                            <th>Téléphone</th>
                            <th>Fonction</th>
                            <th>Hôte Visité</th>
                            <th>Badge</th>
                            <th>Entrée</th>
                            <th>Sortie</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="table-visites-body">
                        <!-- Rempli dynamiquement en JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
