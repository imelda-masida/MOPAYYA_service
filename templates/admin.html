<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="/static/js/admin.js" defer></script>
    <title>Tableau de Bord Administration - MOPAYA</title>
</head>
<body class="bg-light">
    <!-- BARRE DE NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">MOPAYA - Administration</a>
            <div class="d-flex gap-2">
                <!-- Bouton de retour vers la borne publique -->
                <a href="/" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-display" viewBox="0 0 16 16">
                        <path d="M0 4s0-2 2-2h12s2 0 2 2v6s0 2-2 2H2s-2 0-2-2zm2-1a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zM1.5 13a.5.5 0 0 0 0 1h13a.5.5 0 0 0 0-1z"/>
                    </svg>
                    Voir la Borne
                </a>
                <a href="/admin/logout" class="btn btn-danger btn-sm">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <!-- CARTES INDICATEURS / STATS -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm p-3">
                    <h6 class="text-muted">Visites Aujourd'hui</h6>
                    <h2 class="mb-0 fw-bold text-primary" id="stat-aujourdhui">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm p-3">
                    <h6 class="text-muted">Actuellement sur Site</h6>
                    <h2 class="mb-0 fw-bold text-success" id="stat-sur-site">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white border-0 shadow-sm p-3">
                    <h6 class="text-muted">Visiteurs Récurrents</h6>
                    <h2 class="mb-0 fw-bold text-warning" id="stat-recurrents">0</h2>
                </div>
            </div>
        </div>

        <!-- ZONE DE FILTRES ET TÉLÉCHARGEMENT DE RAPPORTS -->
        <div class="card border-0 shadow-sm mb-4 p-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <input type="text" id="filtre-recherche" class="form-control" placeholder="Rechercher par nom, téléphone, entreprise...">
                </div>
                <div class="col-md-4">
                    <select id="filtre-hote" class="form-select">
                        <option value="">Tous les hôtes visités</option>
                    </select>
                </div>
                <div class="col-md-3 text-end d-flex gap-2 justify-content-end">
                    <a href="/api/rapport/semaine?format=csv" class="btn btn-outline-secondary">Exporter CSV</a>
                    <a href="/api/rapport/semaine?format=pdf" class="btn btn-outline-danger">Exporter PDF</a>
                </div>
            </div>
        </div>

        <!-- TABLEAU DES VISITES -->
        <div class="card border-0 shadow-sm p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Visiteur</th>
                            <th>Téléphone</th>
                            <th>Fonction</th>
                            <th>Hôte Visité</th>
                            <th>Badge</th>
                            <th>Entrée</th>
                            <th>Sortie</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="table-visites-body">
                        <!-- Rempli dynamiquement en JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
