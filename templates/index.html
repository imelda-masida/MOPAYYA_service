<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
    <title>Borne MOPAYA</title>
</head>

<body class="bg-light">

    
    <header class="d-flex justify-content-between align-items-center p-3 shadow-sm mb-4">
        <a href="/admin/login" class="btn btn-success btn-sm d-flex align-items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.8 11.8 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7 7 0 0 0 1.048-.625 11.8 11.8 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.54 1.54 0 0 0-1.044-1.263 63 63 0 0 0-2.887-.87C9.843.266 8.69 0 8 0m0 5a1.5 1.5 0 0 1 .5 2.915.5.5 0 0 0-.5.5v1a.5.5 0 0 0 1 0v-1a1.5 1.5 0 0 1-.5-2.915A1.5 1.5 0 0 1 8 5"/>
            </svg>
            Espace Admin
        </a>
    </header>

    <div class="container">
        
        <div class="step-card text-center">
            
            
            <div id="step-lang" class="step">
                <h1 class="mb-4">Bienvenue | Welcome</h1>
                <p class="text-muted mb-4"><strong>Veuillez choisir votre langue | Please select your language</strong></p>
                <div class="d-grid gap-3">
                    <button class="btn btn-primary btn-lg" onclick="choisirLangue('fr')"> Français</button>
                    <button class="btn btn-outline-primary btn-lg" onclick="choisirLangue('en')">English</button>
                </div>
            </div>

            
            <div id="step-action" class="step hidden">
                <h2 class="mb-4" id="txt-action-title">Que souhaitez-vous faire ?</h2>
                <div class="d-grid gap-3">
                    <button class="btn btn-success btn-lg" onclick="choisirAction('entree')"> Enregistrer une Entrée</button>
                    <button class="btn btn-warning btn-lg" onclick="choisirAction('sortie')">Enregistrer une Sortie</button>
                </div>
            </div>

            
            <div id="step-hote" class="step hidden">
                <h3 class="mb-3">Qui venez-vous visiter ?</h3>
                <div class="mb-3">
                    <select id="select-hote" class="form-select form-select-lg">
                        <option value="" selected disabled>Chargement des membres...</option>
                    </select>
                </div>
                <button class="btn btn-primary w-100" onclick="validerHote()">Suivant</button>
            </div>

            <!-- ETAPE 4: FORMULAIRE ENTRÉE -->
            <div id="step-form" class="step hidden">
                <h3 class="mb-3">Vos Informations</h3>
                <form id="form-visiteur" autocomplete="off" onsubmit="soumettreEntree(event)">
                    <div class="mb-3 text-start">
                        <label for="nom" class="form-label">Nom complet </label>
                        <input type="text" id="nom" class="form-control" placeholder="Ex: Jean Dupont" autocomplete="off" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="tel" class="form-label">Numéro de téléphone </label>
                        <input type="tel" id="tel" class="form-control" placeholder="Ex: +243 ..." autocomplete="off" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="fonction" class="form-label">Fonction | Entreprise</label>
                        <input type="text" id="fonction" class="form-control" placeholder="Ex: Consultant Tech" autocomplete="off">
                    </div>
                    <div class="mb-3 text-start">
                        <label for="adresse" class="form-label">Adresse</label>
                        <input type="text" id="adresse" class="form-control" placeholder="Ex: Kinshasa / Gombe" autocomplete="off">
                    </div>
                    <div class="mb-3 text-start">
                        <label for="genre" class="form-label">Genre </label>
                        <select id="genre" class="form-select" required>
                            <option value="M">Masculin</option>
                            <option value="F">Féminin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Valider l'Entrée</button>
                </form>
            </div>

            <!-- ETAPE 5: FORMULAIRE SORTIE -->
            <div id="step-sortie" class="step hidden">
                <h3 class="mb-3">Enregistrer votre Départ</h3>
                <form id="form-sortie" autocomplete="off" onsubmit="soumettreSortie(event)">
                    <div class="mb-3 text-start">
                        <label for="badge-lettre" class="form-label">Entrez la lettre | code de votre badge </label>
                        <input type="text" id="badge-lettre" class="form-control form-control-lg text-center text-uppercase" placeholder="Ex: A1" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 btn-lg">Restituer le badge & Sortir</button>
                </form>
            </div>

            <!-- ETAPE 6: CONFIRMATION -->
            <div id="step-confirmation" class="step hidden">
                <div class="alert alert-success py-4">
                    <h4 class="alert-heading" id="conf-titre">Opération réussie !</h4>
                    <p id="conf-message" class="mb-0">Merci d'avoir utilisé MOPAYA.</p>
                </div>
                <button class="btn btn-outline-secondary w-100 mt-3" onclick="reinitialiser()">Retour à l'accueil</button>
            </div>

        </div>
    </div>
</body>
</html>
