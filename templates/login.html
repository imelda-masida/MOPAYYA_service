<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Connexion Administration - MOPAYA</title>
    <style>
        :root {
            --mopaya-blue: #051059;
            --mopaya-blue-dark: #030a3a;
        }
        
        body {
            background-color: var(--mopaya-blue) !important;
        }

        /* Titre de l'administration */
        .text-blue {
            color: var(--mopaya-blue) !important;
        }

        /* Bouton principal de connexion */
        .btn-success {
            background-color: var(--mopaya-blue) !important;
            border-color: var(--mopaya-blue) !important;
            padding: 10px;
            font-weight: 600;
        }

        .btn-success:hover {
            background-color: var(--mopaya-blue-dark) !important;
            border-color: var(--mopaya-blue-dark) !important;
        }

        /* Focus sur les champs de saisie */
        .form-control:focus {
            border-color: var(--mopaya-blue) !important;
            box-shadow: 0 0 0 0.25rem rgba(5, 16, 89, 0.25) !important;
        }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow-lg p-4 border-0 rounded-3">
            <h3 class="text-center mb-1 fw-bold text-blue">MOPAYA</h3>
            <p class="text-center text-muted mb-4 small">Espace Administration</p>

            {% if erreur %}
                <div class="alert alert-danger py-2 mb-3 text-center small">{{ erreur }}</div>
            {% endif %}

            <form method="POST" action="/admin/login">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Identifiant</label>
                    <input type="text" name="identifiant" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary">Mot de passe</label>
                    <input type="password" name="mot_de_passe" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 text-white">Se connecter</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/" class="text-muted text-decoration-none small"><- Retour à l'accueil</a>
            </div>
        </div>
    </div>
</body>
</html>
